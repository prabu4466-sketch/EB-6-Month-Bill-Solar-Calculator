<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Future Energies</title>
<style>
*{box-sizing:border-box}
:root{--navy:#0b1f3a;--blue:#1f5fbf;--sun:#f59e0b;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI","Nirmala UI",Latha,Roboto,Arial,sans-serif;color:var(--ink);background:#f8fafc;-webkit-font-smoothing:antialiased}

/* top bar */
header{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);background:rgba(11,31,58,.92);backdrop-filter:blur(8px);color:#fff;z-index:10}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fde68a,#f59e0b 60%,#b45309);box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.7;letter-spacing:1.2px;text-transform:uppercase}
#back{display:none;background:#fff;color:var(--navy);border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
#back.show{display:inline-block}

/* home */
#home{padding-top:64px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b1f3a 0%,#1f5fbf 60%,#38bdf8 100%);color:#fff;padding:clamp(48px,8vw,96px) clamp(20px,6vw,64px)}
.hero:before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(253,230,138,.55),rgba(245,158,11,0) 70%)}
.hero:after{content:"";position:absolute;left:-80px;bottom:-140px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero-in{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;margin-bottom:18px}
.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.15;margin:0 0 14px;font-weight:800;max-width:720px}
.hero p{margin:0;font-size:clamp(15px,2vw,18px);opacity:.9;max-width:620px;line-height:1.6}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:30px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;opacity:.75;letter-spacing:.5px}

.wrap{max-width:1100px;margin:0 auto;padding:40px clamp(16px,4vw,32px) 56px}
.sec-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 22px}
.sec-title h2{margin:0;font-size:22px;color:var(--navy)}
.sec-title span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}

.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--blue),var(--sun));transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(11,31,58,.35);border-color:#cbd5e1}
.card:hover:before{transform:scaleX(1)}
.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,#eff6ff,#e0f2fe);margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:17px;color:var(--navy)}
.card .en{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.card p{margin:0;font-size:14px;color:#475569;line-height:1.55}
.go{margin-top:18px;font-size:14px;font-weight:600;color:var(--blue)}
.go:after{content:" →"}

footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 16px 40px}

/* viewer */
#view{display:none;position:fixed;top:64px;left:0;right:0;bottom:0;background:#fff}
#view iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="logo"></div><div>Future Energies<small>Solar Solutions</small></div></div>
  <button id="back" onclick="goHome()">← முகப்பு</button>
</header>

<main id="home">
  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
</main>

<div id="view"><iframe id="frame" title="Tool" scrolling="yes"></iframe></div>

 eighty ninety'.split(' ');\nconst h3=n=>{let s=n>=100?O[n/100|0]+' hundred':'';n%=100;if(s&&n)s+=' and ';return s+(n>=20?T[n/10|0]+(n%10?' '+O[n%10]:''):n?O[n]:'')};\nconst say=n=>{let s='';[[1e7,'crore'],[1e5,'lakh'],[1e3,'thousand']].forEach(([v,u])=>{if(n>=v){s+=h3(n/v|0)+' '+u+' ';n%=v}});return(s+h3(n)).trim()};\nconst inWords=n=>{const c=Math.round(n*100),r=c/100|0,p=c%100;return((r?say(r):'zero')+' rupees'+(p?' and '+say(p)+' paisa':'')+' only').replace(/\\b(?!and\\b|only\\b)[a-z]/g,m=>m.toUpperCase())};\n\nconst LSK='fe-invoices';\nconst lsAll=()=>{try{return JSON.parse(localStorage.getItem(LSK)||'{}')}catch(e){return{}}};\nconst lsStore={all:async()=>Object.values(lsAll()),put:async(id,r)=>{const o=lsAll();o[id]=r;localStorage.setItem(LSK,JSON.stringify(o))},del:async id=>{const o=lsAll();delete o[id];localStorage.setItem(LSK,JSON.stringify(o))}};\nconst fileStore={all:async()=>(await fetch('/api/records')).json(),put:async(id,r)=>{const x=await fetch('/api/record/'+id,{method:'PUT',body:JSON.stringify(r)});if(!x.ok)throw new Error(x.status)},del:async id=>{await fetch('/api/record/'+id,{method:'DELETE'})}};\nconst ready=(async()=>{\n try{const j=await (await fetch('/api/records')).json();if(Array.isArray(j))return fileStore}catch(e){}\n const cap=async n=>{try{return window.claude?await window.claude.use(n):null}catch(e){return null}};\n const db=await cap('db'),user=await cap('user');\n try{\n  const uid=db&&user?await user.id():null;\n  if(db&&uid){const col=db.collection('data/users/'+uid);return{all:async()=>(await col.get()).docs.map(d=>d.data()).filter(Boolean),put:(id,r)=>col.doc(id).set(r),del:id=>col.doc(id).delete()}}\n }catch(e){}\n return lsStore;\n})();\n\nlet cur=null,recs=[],dirty=false,timer=0,chain=Promise.resolve();\nconst SAMPLE={coName:'FUTURE ENERGIES',coAddr:'12, 31 Annanagar 1st cross street,\\nKarur-639002.',coPhone:'+91 8870884466',coGstin:'33AQRPP7065K3Z3',coEmail:'futureenergieskarur@gmail.com',coState:'33-Tamil Nadu',custName:' ap:6px;margin-top:8px}\n.tx-actions button{padding:7px 10px;font-size:.75rem}\n.empty{text-align:center;color:#64748b;padding:20px}\n.modal{display:none;position:fixed;inset:0;z-index:1000;background:#000d;align-items:center;justify-content:center;padding:12px}\n.modal-content{background:#fff;border-radius:12px;padding:12px;max-width:100%;max-height:95vh;overflow:auto;text-align:center}\n.modal-content img{max-width:100%;max-height:78vh;object-fit:contain}\n.close{float:right;font-size:1.5rem;border:0;background:#eee;border-radius:50%;width:34px;height:34px}\n.small-note{font-size:.75rem;color:#64748b;margin-top:8px}\n@media(max-width:420px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.actions{grid-template-columns:1fr 1fr}.actions .btn:last-child{grid-column:1/-1}}\n@media print{body{background:white;padding:0}.no-print,.tx-actions{display:none!important}.panel,.card{box-shadow:none;border:1px solid #ccc}.tx-card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<div class=\"container\">\n<header><h1>🏠 வீட்டு வரவு செலவு<\/h1><\/header>\n\n<div class=\"summary\">\n  <div class=\"card balance\"><h3>மீதி இருப்பு (Balance)<\/h3><p class=\"amount\" id=\"netBalance\">₹0.00<\/p><\/div>\n  <div class=\"card income\"><h3>வரவு<\/h3><p class=\"amount\" id=\"totalIncome\">₹0.00<\/p><\/div>\n  <div class=\"card expense\"><h3>செலவு<\/h3><p class=\"amount\" id=\"totalExpense\">₹0.00<\/p><\/div>\n<\/div>\n\n<section class=\"panel no-print\">\n  <h2 id=\"formTitle\">புதிய பதிவு சேர்க்க<\/h2>\n  <form id=\"transactionForm\">\n    <input type=\"hidden\" id=\"editTxId\">\n    <div class=\"form-grid\">\n      <div class=\"form-group\"><label for=\"txDate\">தேதி<\/label><input type=\"date\" id=\"txDate\" required><\/div>\n      <div class=\"form-group\"><label for=\"txType\">வகை<\/label><select id=\"txType\"><option value=\"செலவு\">செலவு (Expense)<\/option><option value=\"வரவு\">வரவு (Income)<\/option><\/select><\/div>\n      <div class=\"form-group\"><label for=\"txCategory\">தலைப்பு / பிரிவு<\/label><select id=\"txCategory\" required><\/select><\/div>\n      <div class=\"form-group\"><label for=\"txAmount\">தொகை (₹)<\/label><input type=\"number\" id=\"txAmount\" min=\"0.01\" step=\"0.01\" placeholder=\"உ.ம். 500\" required><\/div>\n      <div class=\"form-group full\"><label for=\"txDesc\">குறிப்பு / விவரம்<\/label><input type=\"text\" id=\"txDesc\" placeholder=\"உ.ம். மளிகைப் பொருட்கள் வாங்கியது\"><\/div>\n      <div class=\"form-group full\">\n        <label for=\"txReceipt\">ரசீது போட்டோ (Camera / Gallery)<\/label>\n        <input type=\"file\" id=\"txReceipt\" accept=\"image/*\" capture=\"environment\">\n        <div class=\"small-note\">புகைப்படம் தானாகவே சிறிய அளவில் சுருக்கப்பட்டு சேமிக்கப்படும்.<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"btn-row\">\n      <button type=\"button\" class=\"btn secondary\" onclick=\"resetForm()\">படிவத்தைத் துடை<\/button>\n      <button type=\"submit\" class=\"btn\">பதிவு செய்<\/button>\n    <\/div>\n  <\/form>\n<\/section>\n\n<section class=\"panel\">\n  <h2>பதிவுகள் & ரசீதுகள் <span id=\"txCount\" class=\"muted\">(0)<\/span><\/h2>\n  <div class=\"filters no-print\">\n    <select id=\"filterMonth\" onchange=\"render()\"><option value=\"\">அனைத்து மாதங்களும் (All Months)<\/option><\/select>\n    <select id=\"filterType\" onchange=\"render()\"><option value=\"\">அனைத்து வகைகள்<\/option><option value=\"வரவு\">வரவு மட்டும்<\/option><option value=\"செலவு\">செலவு மட்டும்<\/option><\/select>\n    <input class=\"wide\" type=\"text\" id=\"searchInput\" placeholder=\"தலைப்பு / விவரத்தில் தேடுங்கள்...\" oninput=\"render()\">\n    <input type=\"date\" id=\"filterExactDate\" onchange=\"render()\">\n    <button class=\"btn secondary\" type=\"button\" onclick=\"document.getElementById('filterExactDate').value='';render()\">தேதி நீக்கு<\/button>\n  <\/div>\n  <div class=\"actions no-print\">\n    <button class=\"btn green\" onclick=\"shareToWhatsApp()\">💬 WhatsApp<\/button>\n    <button class=\"btn\" onclick=\"window.print()\">🖨️ பிரிண்ட்<\/button>\n    <button class=\"btn danger\" onclick=\"clearAllData()\">🗑️ அனைத்தையும் அழி<\/button>\n    <button class=\"btn secondary\" onclick=\"exportData()\">📥 Export<\/button>\n    <label class=\"btn secondary\" style=\"text-align:center;cursor:pointer\">📤 Import<input id=\"importFile\" type=\"file\" accept=\".json,application/json\" hidden onchange=\"importData(event)\"><\/label>\n  <\/div>\n  <div class=\"tx-list\" id=\"transactionListContainer\"><\/div>\n<\/section>\n<\/div>\n\n<div class=\"modal\" id=\"receiptModal\" onclick=\"closeModal()\">\n  <div class=\"modal-content\" onclick=\"event.stopPropagation()\">\n    <button class=\"close\" onclick=\"closeModal()\">×<\/button>\n    <h3 id=\"modalTitle\">ரசீது புகைப்படம்<\/h3>\n    <img id=\"modalImage\" alt=\"Receipt\">\n  <\/div>\n<\/div>\n\n<script>\nconst categories={\n  \"வரவு\":[\"சம்பளம் (Salary)\",\"வியாபார வருமானம் (Business)\",\"வாடகை வருமானம் (Rental)\",\"சேமிப்பு வட்டி (Interest)\",\"பிற வரவுகள் (Other Income)\"],\n  \"செலவு\":[\"பிற செலவுகள் (Other Expenses)\",\"மளிகை & உணவு (Groceries & Food)\",\"காய்கறி & பால் (Vegetables & Milk)\",\"மின்சாரம் & குடிநீர் (Utilities)\",\"வீட்டு வாடகை (Rent)\",\"மருத்துவம் (Medical)\",\"கல்வி (Education)\",\"போக்குவரத்து (Transport)\",\"துணிமணி & ஷாப்பிங் (Shopping)\",\"பொழுதுபோக்கு & விழாக்கள் (Entertainment/Festivals)\"]\n};\nconst STORAGE_KEY='family_accounts_thumb';\nlet transactions=[];\n\ntry{\n  transactions=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');\n  if(!Array.isArray(transactions))transactions=[];\n}catch(e){transactions=[]}\n\nconst todayLocal=()=>{\n  const d=new Date();\n  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\n};\ndocument.getElementById('txDate').value=todayLocal();\n\nconst money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});\n\nfunction saveStorage(){\n  try{\n    localStorage.setItem(STORAGE_KEY,JSON.stringify(transactions));\n    return true;\n  }catch(e){\n    alert('சேமிப்பகத்தில் இடம் போதவில்லை. தொடர்ந்து பயன்படுத்த பழைய பதிவுகளை Export செய்துவிட்டு நீக்கவும்.');\n    return false;\n  }\n}\n\nfunction compressImage(file, callback) {\n    const reader = new FileReader();\n    reader.onload = function(event) {\n        const img = new Image();\n        img.onload = function() {\n            const canvas = document.createElement('canvas');\n            const MAX_WIDTH = 800;\n            const MAX_HEIGHT = 800;\n            let width = img.width;\n            let height = img.height;\n            if (width > height) {\n                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }\n            } else {\n                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }\n            }\n            canvas.width = width;\n            canvas.height = height;\n            const ctx = canvas.getContext('2d');\n            ctx.drawImage(img, 0, 0, width, height);\n            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);\n            callback(dataUrl);\n        }\n        img.onerror = () => alert('படத்தைப் படிக்க முடியவில்லை.');\n        img.src = event.target.result;\n    }\n    reader.readAsDataURL(file);\n}\n\nfunction updateCategories(selected=''){\n  const type=document.getElementById('txType').value;\n  const sel=document.getElementById('txCategory');\n  sel.innerHTML='';\n  (categories[type]||categories['செலவு']).forEach(c=>{\n    const o=document.createElement('option');\n    o.value=c;\n    o.textContent=c;\n    sel.appendChild(o);\n  });\n  if(selected&&[...sel.options].some(o=>o.value===selected))sel.value=selected;\n}\ndocument.getElementById('txType').addEventListener('change',()=>updateCategories());\nupdateCategories();\n\nfunction populateMonths(){\n    const el=document.getElementById('filterMonth');\n    const old=el.value;\n    const months=new Set();\n    transactions.forEach(t=>{if(t.date)months.add(t.date.slice(0,7))});\n    el.innerHTML='<option value=\"\">அனைத்து மாதங்களும் (All Months)<\/option>';\n    [...months].sort().reverse().forEach(m=>{\n        const [y,mo]=m.split('-');\n        const d=new Date(Number(y),Number(mo)-1,1);\n        const op=document.createElement('option');\n        op.value=m;\n        op.textContent=d.toLocaleString('ta-IN',{month:'long',year:'numeric'});\n        el.appendChild(op);\n    });\n    if(old && [...el.options].some(o=>o.value===old)){\n        el.value=old;\n    } else {\n        el.value=\"\";\n    }\n}\n\nfunction resetForm(){\n  document.getElementById('transactionForm').reset();\n  document.getElementById('editTxId').value='';\n  document.getElementById('txDate').value=todayLocal();\n  document.getElementById('formTitle').textContent='புதிய பதிவு சேர்க்க';\n  document.querySelector('#transactionForm button[type=\"submit\"]').textContent='பதிவு செய்';\n  updateCategories();\n}\n\ndocument.getElementById('transactionForm').addEventListener('submit',e=>{\n    e.preventDefault();\n    const id=document.getElementById('editTxId').value;\n    const date=document.getElementById('txDate').value;\n    const type=document.getElementById('txType').value;\n    const category=document.getElementById('txCategory').value;\n    const amount=Number(document.getElementById('txAmount').value);\n    const desc=document.getElementById('txDesc').value.trim()||'-';\n    \n    if(!date||!Number.isFinite(amount)||amount<=0){alert('தேதி மற்றும் சரியான தொகையை உள்ளிடவும்.');return}\n    \n    const old=id?transactions.find(t=>String(t.id)===String(id)):null;\n\n    if(type === 'செலவு') {\n        const otherTransactions = transactions.filter(t => !old || String(t.id) !== String(old.id));\n        const totalInc = otherTransactions.filter(t => t.type === 'வரவு').reduce((s,t) => s + Number(t.amount || 0), 0);\n        const totalExp = otherTransactions.filter(t => t.type === 'செலவு').reduce((s,t) => s + Number(t.amount || 0), 0);\n        const availableBalance = totalInc - totalExp;\n        \n        if(amount > availableBalance) {\n            alert(`⚠️ உங்களிடம் உள்ள மீதி இருப்பு (Balance: ${money(availableBalance)}) தொகையை விடச் செலவுத் தொகை அதிகமாக உள்ளது! முதலில் வரவு (Income) பதிவு செய்ய வேண்டும்.`);\n            return;\n        }\n    }\n\n    const file=document.getElementById('txReceipt').files[0];\n\n    const commit=receipt=>{\n        const tx={\n            id:old?old.id:Date.now(),\n            date,\n            type,\n            category,\n            desc,\n            amount,\n            receipt:receipt===undefined?(old?.receipt||null):receipt\n        };\n        if(old)transactions=transactions.map(t=>String(t.id)===String(id)?tx:t);\n        else transactions.push(tx);\n        \n        if(saveStorage()){\n            resetForm();\n            render();\n            alert(old?'பதிவு திருத்தப்பட்டது.':'பதிவு சேமிக்கப்பட்டது.');\n        }\n    };\n\n    if(file){\n        if(!file.type.startsWith('image/')){alert('படக் கோப்பை மட்டும் தேர்வு செய்யவும்.');return}\n        compressImage(file, compressedUrl => {\n            commit(compressedUrl);\n        });\n    } else {\n        commit(undefined);\n    }\n});\n\nfunction visibleTransactions(){\n    const month=document.getElementById('filterMonth').value;\n    const type=document.getElementById('filterType') ? document.getElementById('filterType').value : '';\n    const q=document.getElementById('searchInput').value.trim().toLocaleLowerCase();\n    const date=document.getElementById('filterExactDate').value;\n    return transactions.filter(t=>(!month||(t.date||'').startsWith(month))&&(!type||t.type===type)&&(!date||t.date===date)&&(!q||`${t.category||''} ${t.desc||''} ${t.date||''} ${t.amount||''}`.toLocaleLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||Number(b.id)-Number(b.id));\n}\n\nfunction render(){\n    populateMonths();\n    const list=visibleTransactions();\n    const container=document.getElementById('transactionListContainer');\n    container.innerHTML='';\n    document.getElementById('txCount').textContent=`(${list.length})`;\n    \n    const income=list.filter(t=>t.type==='வரவு').reduce((s,t)=>s+Number(t.amount||0),0);\n    const expense=list.filter(t=>t.type==='செலவு').reduce((s,t)=>s+Number(t.amount||0),0);\n    document.getElementById('totalIncome').textContent=money(income);\n    document.getElementById('totalExpense').textContent=money(expense);\n    document.getElementById('netBalance').textContent=money(income-expense);\n    \n    if(!list.length){\n        container.innerHTML='<div class=\"empty\">பதிவுகள் எதுவும் இல்லை.<\/div>';\n        return;\n    }\n    \n    list.forEach(t=>{\n        const card=document.createElement('article');\n        card.className='tx-card';\n        const top=document.createElement('div');\n        top.className='tx-top';\n        const info=document.createElement('div');\n        \n        const catDiv = document.createElement('div');\n        catDiv.className = 'tx-category';\n        catDiv.textContent = t.category || 'பிரிவு இல்லை';\n        \n        const mutedDiv = document.createElement('div');\n        mutedDiv.className = 'muted';\n        mutedDiv.textContent = `📅 ${t.date || '-'} · ${t.desc || '-'}`;\n        \n        const tagSpan = document.createElement('span');\n        tagSpan.className = 'tag';\n        tagSpan.textContent = t.type || '';\n        \n        info.appendChild(catDiv);\n        info.appendChild(mutedDiv);\n        info.appendChild(tagSpan);\n        \n        const right=document.createElement('div');\n        right.className='tx-right';\n        const amount=document.createElement('div');\n        amount.className='tx-amount '+(t.type==='வரவு'?'income':'expense');\n        amount.textContent=(t.type==='வரவு'?'+ ':'− ')+money(t.amount);\n        right.appendChild(amount);\n        top.append(info,right);\n        card.appendChild(top);\n        \n        if(t.receipt){\n            const row=document.createElement('div');\n            row.className='receipt-row';\n            const img=document.createElement('img');\n            img.className='receipt-thumb';\n            img.src=t.receipt;\n            img.alt='ரசீது';\n            img.onclick=()=>showReceipt(t.receipt,t.category);\n            const label=document.createElement('span');\n            label.className='muted';\n            label.textContent='📷 ரசீதைப் பார்க்க படத்தைத் தொடவும்';\n            row.append(img,label);\n            card.appendChild(row);\n        }\n        \n        const buttons=document.createElement('div');\n        buttons.className='tx-actions no-print';\n        const edit=document.createElement('button');\n        edit.className='btn secondary';\n        edit.textContent='✏️ திருத்து';\n        edit.onclick=()=>editTransaction(t.id);\n        const del=document.createElement('button');\n        del.className='btn danger';\n        del.textContent='🗑️ நீக்கு';\n        del.onclick=()=>deleteTransaction(t.id);\n        buttons.append(edit,del);\n        card.appendChild(buttons);\n        container.appendChild(card);\n    });\n}\n\nfunction editTransaction(id){\n  const t=transactions.find(x=>String(x.id)===String(id));\n  if(!t)return;\n  document.getElementById('editTxId').value=t.id;\n  document.getElementById('txDate').value=t.date||todayLocal();\n  document.getElementById('txType').value=t.type||'செலவு';\n  updateCategories(t.category);\n  document.getElementById('txAmount').value=t.amount;\n  document.getElementById('txDesc').value=t.desc==='-'?'':(t.desc||'');\n  document.getElementById('txReceipt').value='';\n  document.getElementById('formTitle').textContent='பதிவைத் திருத்தவும்';\n  document.querySelector('#transactionForm button[type=\"submit\"]').textContent='மாற்றத்தைச் சேமி';\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n\nfunction deleteTransaction(id){\n  if(!confirm('இந்தப் பதிவை நீக்க வேண்டுமா?'))return;\n  transactions=transactions.filter(t=>String(t.id)!==String(id));\n  saveStorage();\n  render();\n}\n\nfunction clearAllData(){\n  if(!confirm('அனைத்து பதிவுகளையும் ரசீதுகளையும் நிரந்தரமாக அழிக்க வேண்டுமா?'))return;\n  transactions=[];\n  saveStorage();\n  resetForm();\n  render();\n}\n\nfunction exportData(){\n  const blob=new Blob([JSON.stringify({app:'வீட்டு வரவு செலவு',version:1,transactions},null,2)],{type:'application/json;charset=utf-8'});\n  const url=URL.createObjectURL(blob);\n  const a=document.createElement('a');\n  a.href=url;\n  a.download='veettu_varavu_selavu_backup_'+todayLocal()+'.json';\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  setTimeout(()=>URL.revokeObjectURL(url),1000);\n}\n\nfunction importData(event){\n  const file=event.target.files[0];\n  if(!file)return;\n  const reader=new FileReader();\n  reader.onload=()=>{\n    try{\n      const data=JSON.parse(reader.result);\n      const incoming=Array.isArray(data)?data:data.transactions;\n      if(!Array.isArray(incoming))throw Error('invalid');\n      if(!confirm(`கோப்பில் ${incoming.length} பதிவுகள் உள்ளன. தற்போதைய பதிவுகளுக்குப் பதிலாக இவற்றை இறக்குமதி செய்யவா?`))return;\n      transactions=incoming.filter(t=>t&&t.date&&['வரவு','செலவு'].includes(t.type)&&Number.isFinite(Number(t.amount))).map((t,i)=>({...t,id:t.id??Date.now()+i,amount:Number(t.amount),receipt:t.receipt||null}));\n      if(saveStorage()){\n        resetForm();\n        render();\n        alert('Import முடிந்தது.');\n      }\n    }catch(e){\n      alert('இந்த JSON கோப்பை வாசிக்க முடியவில்லை அல்லது கோப்பு சரியான வடிவில் இல்லை.');\n    }finally{\n      event.target.value='';\n    }\n  };\n  reader.readAsText(file);\n}\n\nfunction shareToWhatsApp(){\n  const list=visibleTransactions();\n  if(!list.length){ alert('பகிர பதிவுகள் இல்லை.'); return; }\n  const totals=list.reduce((a,t)=>{a[t.type==='வரவு'?'income':'expense']+=Number(t.amount||0);return a},{income:0,expense:0});\n  let textMsg='🏠 வீட்டு வரவு செலவு\\n';\n  list.forEach(t=>textMsg+=`\\n${t.date} | ${t.type} | ${t.category} | ₹${Number(t.amount).toLocaleString('en-IN')} | ${t.desc||'-'}`);\n  textMsg+=`\\n\\nமொத்த வரவு: ${money(totals.income)}\\nமொத்த செலவு: ${money(totals.expense)}\\nமீதி: ${money(totals.income-totals.expense)}`;\n  window.open('https://wa.me/?text='+encodeURIComponent(textMsg),'_blank');\n}\n\nfunction showReceipt(src,title){\n  document.getElementById('modalImage').src=src;\n  document.getElementById('modalTitle').textContent=title||'ரசீது புகைப்படம்';\n  document.getElementById('receiptModal').style.display='flex';\n}\n\nfunction closeModal(){\n  document.getElementById('modalImage').src='';\n  document.getElementById('receiptModal').style.display='none';\n}\n\nrender();\n<\/script>\n<\/body>\n<\/html>"}, {"file": "Power_Calculator.html", "label": "பவர் கால்குலேட்டர்", "html": "<!DOCTYPE html>\n<html lang=\"ta\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Future Energies – சோலார் கணக்கீடு<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:#eef2f5;color:#1b2430;font:15px/1.5 \"Noto Sans Tamil\",\"Nirmala UI\",Latha,system-ui,sans-serif}\n[hidden]{display:none!important}\n.wrap{max-width:980px;margin:auto;padding:12px}\n.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:#0f6e56;color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:12px}\n.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px #0002;margin-bottom:12px}\n.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}\nlabel{display:block;font-size:13px;col >\n   <label>வீட்டில் இருக்கும் நாட்கள்<input id=\"hm\" type=\"number\" step=\"any\"><\/label>\n   <label>வீட்டில் இல்லா நாட்கள்<span class=\"ro\" id=\"aw\"><\/span><\/label>\n   <label>1 kW ஒரு நாள் உற்பத்தி (யூனிட்)<input id=\"yl\" type=\"number\" step=\"any\"><\/label>\n  <\/div>\n  <p class=\"msg\" id=\"mode\"><\/p><p class=\"sm\" id=\"ast\"><\/p>\n <\/div>\n\n <div class=\"card\">\n  <div class=\"tw\"><table id=\"tbl\"><colgroup><col style=\"width:240px\"><col style=\"width:92px\"><col style=\"width:84px\"><col style=\"width:84px\"><col style=\"width:112px\"><col style=\"width:120px\"><col style=\"width:46px\"><\/colgroup><thead><tr><th>சாதனம்<\/th><th>எண்ணிக்கை<\/th><th>தலா W<\/th><th>மணி/நாள்<\/th><th>நேரடி யூனிட்/நாள்<\/th><th>வீட்டில் இல்லாத போதும் ஓடும்<\/th><th><\/th><\/tr><\/thead><tbody id=\"tb\"><\/tbody><\/table><\/div>\n  <button class=\"s\" id=\"add\">+ சாதனம் சேர்<\/button>\n  <p class=\"sm\">சாதனப் பெயர் தேர்ந்தால் W தானாக வரும். \"நேரடி யூனிட்\" நிரப்பினால் W × மணி கணக்குக்குப் பதிலாக அதுவே பயன்படும் (எ.கா. ஃபிரிட்ஜ் 1.5).<\/p>\n  <div class=\"sum\" id=\"sum\"><\/div>\n  <div><button id=\"sv\">சேமி<\/button><button class=\"s\" id=\"pe\">அச்சு முன்னோட்டம் / PDF<\/button><\/div>\n  <p class=\"sm\">லெட்டர்ஹெட் படம் (விருப்பம்): <input type=\"file\" id=\"lhf\" accept=\"image/*\" style=\"width:auto;margin:0\"> <button class=\"s\" id=\"lhd\">நீக்கு<\/button> <span id=\"lhs\"><\/span><\/p>\n  <p class=\"msg\" id=\"msg\"><\/p>\n <\/div>\n\n <div class=\"card\">\n  <b>சேமித்த பதிவுகள்<\/b>\n  <div id=\"lsbox\" class=\"sm\" style=\"margin-top:6px\">ஏற்றப்படுகிறது…<\/div>\n <\/div>\n<\/div>\n<\/div>\n\n<div id=\"pv\" hidden>\n <div class=\"tb2 noprint\"><button class=\"s\" id=\"bk\">← திரும்பு<\/button><button id=\"dl\">PDF பதிவிறக்கு<\/button><button class=\"s\" id=\"pr\">அச்சிடு<\/button><p class=\"sm\" id=\"pst\">PDF பதிவிறக்கு பட்டனை அழுத்தவும். பதிவிறக்கம் வேலை செய்யாவிட்டால் அச்சிடு → Save as PDF தேர்வு செய்யவும்.<\/p><\/div>\n <div class=\"sheetwrap\ (e.key==='Enter'&&e.target.tagName==='INPUT')scheduleSave();});\n$('ed').addEventListener('click',e=>{if(e.target.id==='add'||e.target.dataset.del!=null)scheduleSave();});\n$('tb').addEventListener('click',e=>{const i=e.target.dataset.del;if(i!=null){S.rows.splice(+i,1);drawRows();refresh();}});\n$('tb').addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset.k){e.preventDefault();const nx=$('tb').querySelector(`[data-i=\"${+t.dataset.i+1}\"][data-k=\"${t.dataset.k}\"]`);if(nx)nx.focus();}});\n$('add').onclick=()=>{S.rows.push({n:'',q:1,w:'',h:'',d:'',a:false});drawRows();refresh();};\n$('nw').onclick=()=>{S=blank();drawTop();drawRows();refresh();show('ed');};\n$('bk').onclick=()=>{drawTop();drawRows();refresh();show('ed');};\n$('pe').onclick=preview;\n$('pr').onclick=()=>window.print();\n$('dl').onclick=dlPdf;\n$('sv').onclick=save;\n\nfunction preview(){\n const c=calc(S),LH=getLH();\n $('sheet').style.backgroundImage=LH?`url(\"${LH}\")`:'none';\n const head=LH?'':`<div class=\"hd\"><div><b>${CO.n}<\/b><div class=\"ad\">${CO.a}<\/div><div class=\"ad\">Cell - ${CO.p}<\/div><\/div><\/div><div class=\"ac\"><\/div>`;\n const rows=c.lines.map(l=>`<tr><td>${esc(l.n)}<\/td><td class=\"r\">${num(l.q)}<\/td><td class=\"r\">${num(l.w)}<\/td><td class=\"r\">${num(l.h)}<\/td><td class=\"r\">${f2(l.u)}<\/td><\/tr>`).join('');\n $('sheet').innerHTML=`<div class=\"ct\">${head}\n<div class=\"ttl\">வீட்டு உபயோக சோலார் மின் அமைப்பு அறிக்கை<\/div>\n<div class=\"info\"><div><span>வாடிக்கையாளர் பெயர்<\/span><b>${esc(S.name)}<\/b><\/div><div><span>தொலைபேசி எண்<\/span><b>${esc(S.phone)}<\/b><\/div><div style=\"grid-column:1/-1\"><span>கணக்கீட்டு முறை<\/span><b>${c.P} நாள் சுழற்சி · ${c.H} நாள் வீட்டில்<\/b><\/div><\/div>\n<div class=\"sec\">1. உபகரணங்களின் விவரங்கள்<\/div>\n<table><thead><tr><th>சாதனம்<\/th><th class=\"r\">எண்ணிக்கை<\/th><th class=\"r\">தலா W<\/th><th class=\"r\">நேரம் (மணி/நாள்)<\/th><th class=\"r\">ஒரு நாள் யூனிட்<\/th><\/tr><\/thead><tbody>${rows}<\/tbody><tfoot><tr class=\"tot\"><td colspan=\"4\">ஒரு நாள் மொத்தம்<\/td><td class=\"r\">${f2(c.day)}<\/td><\/tr><\/tfoot><\/table>\n<div class=\"sec\">2. மின் சுழற்சி விவரங்கள்<\/div>\n<table><tbody><tr><td>வீட்டில் இருக்கும் நாட்கள் (${c.H} நாள்)<\/td><td class=\"r\">தினம் ${f2(c.day)} × ${c.H}<\/td><td class=\"r\">${f2(c.homeT)} யூனிட்<\/td><\/tr><tr><td>வீட்டில் இல்லா நாட்கள் (${c.A} நாள்)<\/td><td class=\"r\">தினம் ${f2(c.away)} × ${c.A}<\/td><td class=\"r\">${f2(c.awayT)} யூனிட்<\/td><\/tr><tr class=\"tot\"><td colspan=\"2\">${c.P} நாள் சுழற்சிக்கான மொத்த மின் தேவை<\/td><td class=\"r\">${f2(c.tot)} யூனிட்<\/td><\/tr><\/tbody><\/table>\n<div class=\"sec\">3. பரிந்துரைக்கப்படும் சோலார் அமைப்பு<\/div>\n<div class=\"res\"><div class=\"big\">${c.rec}<span>kW<\/span><\/div><div><b>ஆன்-கிரிட் சோலார் சிஸ்டம் (On-Grid)<\/b><\/div><\/div>\n<div class=\"nt\">குறிப்பு: இது கணக்கீட்டின் அடிப்படையிலான மதிப்பீடு. உண்மையான உற்பத்தி நிறுவல் இடம் மற்றும் வானிலையைப் பொறுத்து மாறலாம்.<\/div>\n<div class=\"ft\">நன்றி<\/div><\/div>`;\n show('pv');\nconst ct=$('sheet').querySelector('.ct'),avail=(297-52-18)*96/25.4,hh=ct.offsetHeight;\nif(hh>avail){ct.style.transformOrigin='top center';ct.style.transform='scale('+(avail/hh)+')';}\n}\n\nfunction snap(){return JSON.stringify([S.name.trim(),digits(S.phone),num(S.cycle),num(S.home),num(S.yield1),S.rows]);}\nfunction setMode(){$('mode').textContent=S.orig?'பதிவு திருத்தப்படுகிறது — மாற்றங்கள் தானாக சேமிக்கப்படும்':'புதிய பதிவு — பெயரும் 10 இலக்க தொலைபேசி எண்ணும் நிரப்பியதும் தானாக சேமிக்கப்படும்';}\nfunction scheduleSave(){clearTimeout(sTimer);sTimer=setTimeout(()=>{if(snap()!==lastSaved)doSave(false);},400);}\nasync function doSave(manual){\n const id=digits(S.phone),say=t=>{if(manual)msg(t);else $('ast').textContent=t;};\n if(!S.name.trim()||id.length<10){if(manual)msg('பெயர் மற்றும் 10 இலக்க தொலைபேசி எண் உள்ளிடவும்');return;}\n if(saving){pend=true;return;}\n saving=true;say('சேமிக்கிறது…');\n const key=snap();\n try{\n  await putRec({id,name:S.name.trim(),phone:S.phone.trim(),cycle:num(S.cycle),home:num(S.home),yield1:num(S.yield1),rows:S.rows,upd:Date.now()});\n  S.orig=id;lastSaved=key;setMode();\n  say(manual?'சேமிக்கப்பட்டது ✓':'தானாக சேமிக்கப்பட்டது ✓ '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}));\n  await loadList();\n }catch(e){say('சேமிக்க முடியவில்லை, மீண்டும் முயற்சிக்கவும்');}\n finally{saving=false;}\n if(pend){pend=false;doSave(false);}\n}\nasync function save(){return doSave(true);}\nconst API=/^(127\\.0\\.0\\.1|localhost)$/.test(location.hostname);\nconst LSK='fe_records';\nfunction lsAll(){try{return JSON.parse(localStorage.getItem(LSK)||'[]')}catch(e){return []}}\nasync function listRecs(){\n if(API){const r=await fetch('/api/records');if(!r.ok)throw new Error('list');return r.json();}\n return lsAll();\n}\nasync function putRec(rec){\n if(API){const r=await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});if(!r.ok)throw new Error('save');return;}\n localStorage.setItem(LSK,JSON.stringify(lsAll().filter(x=>x.id!==rec.id).concat([rec])));\n}\nasync function removeRec(id){\n if(API){const r=await fetch('/api/records/'+encodeURIComponent(id),{method:'DELETE'});if(!r.ok)throw new Error('del');return;}\n localStorage.setItem(LSK,JSON.stringify(lsAll().filter(x=>x.id!==id)));\n}\nasync function saveFile(name,buf){\n if(API){const u=URL.createObjectURL(new Blob([buf],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return;}\n const dl=await window.claude.use('downloads');\n if(!dl)throw Object.assign(new Error('nodl'),{code:'nodl'});\n await dl.save({filename:name,data:buf});\n}\nasync function loadList(){\n try{\n  recs=(await listRecs()).sort((a,b)=>(b.upd||0)-(a.upd||0));\n  $('lsbox').innerHTML=recs.length?recs.map((r,i)=>`<div class=\"row\"><div data-e=\"${i}\" style=\"cursor:pointer\"><b>${esc(r.name)}<\/b> · ${esc(r.phone)} · <b>${calc(r).rec} kW<\/b><div class=\"sm\">${new Date(r.upd).toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}<\/div><\/div><div><button class=\"s\" data-v=\"${i}\">பார்<\/button><button class=\"s\" data-e=\"${i}\">திருத்து<\/button><button class=\"x\" data-x=\"${i}\">நீக்கு<\/button><\/div><\/div>`).join(''):'சேமித்த பதிவுகள் இல்லை';\n }catch(e){$('lsbox').textContent='பதிவுகளை எடுக்க முடியவில்லை';}\n}\nasync function delRec(id,btn){\n if(!btn.dataset.arm){btn.dataset.arm=1;btn.textContent='உறுதியா?';return;}\n try{\n  await removeRec(id);\n  if(S.orig===id){S=blank();drawTop();drawRows();refresh();}\n  msg('நீக்கப்பட்டது');await loadList();\n }catch(e){msg('நீக்க முடியவில்லை');}\n}\n$('lsbox').addEventListener('click',e=>{\n const el=e.target.closest('[data-v],[data-e],[data-x]');if(!el)return;const ds=el.dataset;\n if(ds.v!=null){loadRec(recs[+ds.v]);preview();}\n else if(ds.e!=null){loadRec(recs[+ds.e]);drawTop();drawRows();refresh();show('ed');msg('பதிவு திருத்தத்துக்கு ஏற்றப்பட்டது');}\n else if(ds.x!=null)delRec(recs[+ds.x].id,el);\n});\n\nfunction getLH(){try{return localStorage.getItem('fe_lh')||DEF_LH}catch(e){return DEF_LH}}\nasync function dlPdf(){\n const b=$('dl'),st=$('pst'),holder=document.createElement('div'),LH=getLH();\n b.disabled=true;st.textContent='PDF தயாராகிறது…';\n holder.className='sheet';\n holder.style.cssText='position:absolute;left:0;top:0;width:170mm;padding:0;margin:0;background:none;box-shadow:none;zoom:1;min-height:0';\n try{\n  const el=$('sheet').querySelector('.ct').cloneNode(true);\n  el.style.transform='none';\n  holder.appendChild(el);document.body.appendChild(holder);\n  await Promise.all([...el.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));\n  const cv=await html2canvas(el,{scale:2,backgroundColor:null,width:el.offsetWidth,windowWidth:el.offsetWidth});\n  holder.remove();\n  const PW=210,PH=297,TOP=52,BOT=18,W=170,AV=PH-TOP-BOT;\n  const hMM=cv.height*W/cv.width,k=hMM>AV?AV/hMM:1,w=W*k,h=hMM*k;\n  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});\n  if(LH)pdf.addImage(LH,LH.startsWith('data:image/png')?'PNG':'JPEG',0,0,PW,PH);\n  pdf.addImage(cv.toDataURL('image/png'),'PNG',(PW-w)/2,TOP,w,h);\n  const nm=(S.name||'report').replace(/[\\\\/:*?\"<>|]/g,'').trim()||'report';\n  await saveFile(nm+'-'+digits(S.phone)+'.pdf',pdf.output('arraybuffer'));\n  st.textContent='PDF பதிவிறக்கப்பட்டது ✓';\n }catch(e){st.textContent=e&&e.code==='nodl'?'பதிவிறக்கம் இங்கே கிடைக்கவில்லை — அச்சிடு பட்டனை பயன்படுத்தவும்':e&&e.code==='declined'?'பதிவிறக்கம் ரத்து செய்யப்பட்டது':'PDF உருவாக்க முடியவில்லை — அச்சிடு பட்டனை பயன்படுத்தவும்';}\n finally{holder.remove();b.disabled=false;}\n}\n$('lhs').textContent='இயல்பு லெட்டர்ஹெட் படம் பின்னணியாக வரும்; வேறு படம் வேண்டுமெனில் பதிவேற்றவும்';\n$('lhf').addEventListener('change',e=>{\n const f=e.target.files[0];if(!f)return;\n const rd=new FileReader();\n rd.onload=async()=>{\n  try{\n   const img=new Image();img.src=rd.result;await img.decode();\n   const k=Math.min(1,1000/img.width),cv=document.createElement('canvas');\n   cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);\n   cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);\n   localStorage.setItem('fe_lh',cv.toDataURL('image/png'));\n   $('lhs').textContent='லெட்டர்ஹெட் சேமிக்கப்பட்டது ✓';\n  }catch(err){$('lhs').textContent='லெட்டர்ஹெட் சேமிக்க முடியவில்லை';}\n };\n rd.readAsDataURL(f);\n});\n$('lhd').onclick=()=>{try{localStorage.removeItem('fe_lh')}catch(e){}$('lhs').textContent='லெட்டர்ஹெட் நீக்கப்பட்டது';};\n$('lib').innerHTML=[...LIB.keys()].map(k=>`<option value=\"${esc(k)}\">`).join('');\ndrawTop();drawRows();refresh();show('ed');\nloadList();\n<\/script>\n<\/body>\n<\/html>\n"}, {"file": "Solar_Shadow_Free.html", "label": "சூரிய நிழல் கணக்கீடு", "html": "<!DOCTYPE html>\n<html lang=\"ta\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Future Energies – சூரிய நிழல் கணக்கீடு<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap\">\n<style>\n:root{box-sizing:border-box;--bg:#f6f7f2;--card:#fff;--text:#1f2a1f;--muted:#66715f;--accent:#e58e00;--line:#dde3d6}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#121611;--card:#1d241c;--text:#e9efe6;--muted:#a3b09d;--accent:#ffb74a;--line:#34402f}}\n:root[data-theme=\"dark\"]{--bg:#121611;--card:#1d241c;--text:#e9efe6;--muted:#a3b09d;--accent:#ffb74a;--line:#34402f}\n*{box-sizing:border-box}[hidden]{display:none!important}\nhtml,body{height:100%;margin:0}\nbody{background:var(--bg);color:var(--text);font-family:'Noto Sans Tamil',system-ui,sans-serif;line-height:1.5}\n#app{display:flex;height:100vh;height:100dvh;overflow:hidden}\n#left{flex:1 1 auto;min-width:0;height:100%;display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow:hidden}\n#right{flex:0 0 400px;max-width:46%;height:100%;overflow-y:auto;padding:12px 14px 90px;border-left:1px solid var(--line)}\n#app.p1 #left{display:none}\n#app.p1 #right{flex:1 1 auto;max-width:none;border-left:none;display:flex;justify-content:center;padding-top:40px}\n#page1{width:100%;max-width:420px}\n#noPhoto{color:var(--muted);margin-top:30%;text-align:center}\n.stage{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}\n#pImg{display:block;width:100%;height:100%;border-radius:12px;pointer-events:none;-webkit-user-drag:none}\n#pSvg{position:absolute;top:0;left:0;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}\n#pSvg *{pointer-events:none}\n#pSvg #bg{pointer-events:all;cursor:crosshair}\n@media (max-width:760px){\n #app{display:block;height:auto;overflow:visible}\n #left{position:sticky;top:0;z-index:5;height:auto;padding:6px;background:var(--bg);display:block}\n #right{flex:none;max-width:none;height:auto;overflow:visible;border-left:none;padding:10px 12px 60px}\n #app.p1 #right{display:block;padding-top:20px}\n}\nh1{font-size:18px;margin:4px 0}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}\nbutton,input,select{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--text);cursor:pointer}\ninput,select{width:100%}input[type=range]{padding:0;border:0;accent-color:var(--accent);margin:6px 0}\nlabel{display:block;font-size:14px;color:var(--muted);margin:6px 0}\n.on,.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}\n.row{display:flex;gap:8px;margin-top:8px;align-items:center}.row>*{flex:1}\n.muted{color:var(--muted);font-size:13px}.err{color:#c62828;font-size:14px;min-height:1.2em;margin-top:6px}\n.big{font-size:15px;font-weight:600}\n.cbg{fill:rgba(0,0,0,.45);stroke:#fff}.nArr{stroke:#ff5252}.sunA{stroke:#ffb74a}\n.ctx{fill:#fff;text-anchor:middle;dominant-baseline:middle;font-weight:700}\n.dot{fill:#7aa2ff}.shdG{fill:#0a1428;opacity:.5}\n.ob{fill:rgba(255,255,255,.12);stroke:#fff}\n.hd{fill:#fff;stroke:#111}.mk{fill:#fff;stroke:#333}\n.lb{fill:#fff;stroke:#000;paint-order:stroke;font-weight:700}\n.pl{fill:#fff;stroke:#000;paint-order:stroke;text-anchor:middle;dominant-baseline:middle;font-weight:700}\n.cal{fill:none;stroke:#00e676}.cdot{fill:#00e676}\n.pend{fill:rgba(255,235,59,.12);stroke:#ffeb3b}\n.sel{fill:none;stroke:#ffeb3b}\n.back{stroke:#fff;stroke-linecap:round}\n.arr{fill:#fff;opacity:.9}\n.tree{fill:url(#cg)}\n.trunk{stroke:#6b4a2b;stroke-linecap:round}\n.zbtn{text-align:left;width:100%;margin-top:4px;font-size:14px}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\" class=\"p1\">\n  <div id=\"left\">\n    <div id=\"noPhoto\">📷 போட்டோ upload பண்ணிய பிறகு இங்கே தோன்றும்<\/div>\n    <div class=\"stage\" id=\"stage\" hidden><img id=\"pImg\" alt=\"\" hidden><svg id=\"pSvg\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialGradient id=\"cg\" cx=\"35%\" cy=\"30%\" r=\"70%\"><stop offset=\"0\" stop-color=\"#9be564\"/><stop offset=\"1\" stop-color=\"#1d5e1a\"/><\/radialGradient><\/defs><rect id=\"bg\" x=\"0\" y=\"0\" width=\"10\" height=\"10\" fill=\"transparent\"/><g id=\"layer\"><\/g><\/svg><\/div>\n  <\/div>\n  <div id=\"right\">\n    <div id=\"page1\">\n      <h1>☀️ சூரிய நிழல் கணக்கீடு<\/h1>\n      <div class=\"card\">\n        <div class=\"big\">1) போட்டோ<\/div>\n        <input type=\"file\" id=\"file\" accept=\"image/*\">\n        <div id=\"locBox\" class=\"card\" hidden>\n          <div class=\"muted\">போட்டோவில் GPS இல்லை. இடத்தின் Lat, Long கொடுங்கள்.<\/div>\n          <div class=\"row\"><input id=\"pCoord\" placeholder=\"உதா: 10.9601, 78.0766\"><button class=\"primary\" id=\"pSetC\">அடுத்து<\/button><\/div>\n        <\/div>\n        <div class=\"err\" id=\"p1Err\"><\/div>\n      <\/div>\n    <\/div>\n\n    <div id=\"page2\" hidden>\n      <div class=\"row\"><button id=\"backP1\">← முதல் பக்கம்<\/button><select id=\"unitSel\"><option value=\"ft\" selected>அடி<\/option><option value=\"m\">மீட்டர்<\/option><option value=\"in\">அங்குலம்<\/option><\/select><\/div>\n      <div class=\"muted\" id=\"pInfo\"><\/div>\n      <div class=\"card\">\n        <div class=\"muted\" id=\"pStep\"><\/div>\n        <div class=\"row\"><button id=\"tMode\">✋ நகர்த்து முறை<\/button><button id=\"fullReset\">கூரையில் இருந்து மீட்டமை<\/button><\/div>\n        <div class=\"err\" id=\"pErr\"><\/div>\n      <\/div>\n\n      <div class=\"card\" id=\"toolCard\" hidden>\n        <div class=\"row\"><button id=\"mPanel\" class=\"on\">▦ பேனல்<\/button><button id=\"mObj\">⬠ பொருள்<\/button><button id=\"mTree\">🌳 மரம்<\/button><button id=\"mRoof\">🏠 கூரை<\/button><\/div>\n      <\/div>\n\n      <div class=\"card\" id=\"roofBox\" hidden>\n        <div class=\"muted\">கூரையின் நீளம், அகலம் கொடுத்து \"அளவு அமை\" அழுத்துங்கள். நீளம் கீழ் பக்கத்தில், அகலம் பக்கத்தில்.<\/div>\n        <div class=\"row\"><label>நீளம் (<span class=\"uName\">அடி<\/span>)<input id=\"rl\" type=\"number\" step=\"0.01\"><\/label><label>அகலம் (<span class=\"uName\">அடி<\/span>)<input id=\"rw\" type=\"number\" step=\"0.01\"><\/label><\/div>\n        <div class=\"row\"><button class=\"primary\" id=\"roofSet\">அளவு அமை<\/button><\/div>\n      <\/div>\n\n      <div class=\"card\" id=\"panelBox\" hidden>\n        <div class=\"muted\" id=\"panelInfo\"><\/div>\n        <div class=\"row\"><label>நீளம் (<span class=\"uName\">அடி<\/span>)<input id=\"zL\" type=\"number\" step=\"0.01\"><\/label><label>அகலம் (<span class=\"uName\">அடி<\/span>)<input id=\"zWd\" type=\"number\" step=\"0.01\"><\/label><button id=\"zRot\">↔ படுக்கை<\/button><\/div>\n        <div class=\"row\"><label>திசை<select id=\"zFd\"><option value=\"180\">தெற்கு<\/option><option value=\"135\">தென்கிழக்கு<\/option><option value=\"90\">கிழக்கு<\/option><option value=\"45\">வடகிழக்கு<\/option><option value=\"0\">வடக்கு<\/option><option value=\"315\">வடமேற்கு<\/option><option value=\"270\">மேற்கு<\/option><option value=\"225\">தென்மேற்கு<\/option><\/select><\/label><label>சாய்வு (°)<input id=\"zTilt\" type=\"number\" value=\"10\" min=\"0\" max=\"45\" step=\"1\"><\/label><\/div>\n        <label>வடக்கு திருத்தம்: <span id=\"pNorthTxt\">0°<\/span><input type=\"range\" id=\"pNorth\" min=\"0\" max=\"359\" step=\"1\" value=\"0\"><\/label>\n        <div class=\"row\"><label>W<input id=\"zW\" type=\"number\" value=\"550\"><\/label><label>வரிசை<input id=\"zR\" type=\"number\" value=\"2\"><\/label><label>நிரை<input id=\"zC\" type=\"number\" value=\"3\"><\/label><\/div>\n        <div class=\"row\"><input id=\"zN\" placeholder=\"பெயர் (உதா: Zone 1)\"><button id=\"zDel\">தேர்ந்ததை நீக்கு<\/button><\/div>\n        <div class=\"muted\" id=\"zSel\">தேர்வு இல்லை<\/div>\n        <div id=\"zList\"><\/div>\n      <\/div>\n\n      <div class=\"card\" id=\"objBox\" hidden>\n        <div class=\"muted\">பேனாவால் பொருளின் வெளி எல்லையை இழுத்து வரையுங்கள்; விட்டதும் பொருள் சேரும். அல்லது ஒவ்வொரு மூலையாக tap பண்ணி \"முடி\" அழுத்துங்கள்.<\/div>\n        <div class=\"row\"><input id=\"mkN\" placeholder=\"பெயர் (உதா: தண்ணீர் தொட்டி)\"><label style=\"flex:0 0 40%\">உயரம் (<span class=\"uName\">அடி<\/span>)<input id=\"mkH\" type=\"number\" min=\"0\" step=\"0.5\"><\/label><\/div>\n        <div class=\"row\"><button class=\"primary\" id=\"mkDone\">முடி<\/button><button id=\"mkUndo\">கடைசிப் புள்ளி நீக்கு<\/button><\/div>\n        <div id=\"objList\"><\/div>\n      <\/div>\n\n      <div class=\"card\" id=\"treeBox\" hidden>\n        <div class=\"muted\">மரம் வைக்க போட்டோவில் tap பண்ணுங்கள். உயரம், அகலம் ஸ்லைடரில் இழுத்தால் கீழே அளவு உடனே தெரியும்.<\/div>\n        <div id=\"treeList\"><\/div>\n      <\/div>\n\n      <div class=\"card\" id=\"timeBox\" hidden>\n        <div class=\"big\">📅 <span id=\"pDayTxt\"><\/span><\/div>\n        <input type=\"range\" id=\"pDay\" min=\"1\" max=\"366\" value=\"1\">\n        <div class=\"row\"><button id=\"pPlay\" style=\"flex:0 0 52px\">▶<\/button><div class=\"big\" id=\"pTimeTxt\" style=\"flex:1\"><\/div><\/div>\n        <input type=\"range\" id=\"pTime\">\n        <div id=\"pStats\" style=\"margin:6px 0\"><\/div>\n        <div id=\"pRd\"><\/div>\n      <\/div>\n\n      <div class=\"row\"><button id=\"allClr\">பேனல், பொருள், மரம் அனைத்தையும் அழி<\/button><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst R = Math.PI / 180, G = 0.02;\nconst UNITS = {m: {name: 'மீட்டர்', sym: 'மீ', f: 1, dec: 2, step: 0.1}, ft: {name: 'அடி', sym: 'அடி', f: 0.3048, dec: 2, step: 0.1}, in: {name: 'அங்குலம்', sym: 'அங்', f: 0.0254, dec: 1, step: 1}};\nconst DIRS = ['வடக்கு','வடகிழக்கு','கிழக்கு','தென்கிழக்கு','தெற்கு','தென்மேற்கு','மேற்கு','வடமேற்கு'];\nconst deg = a => ((a % 360) + 360) % 360;\nconst dirName = a => DIRS[Math.round(deg(a) / 45) % 8];\nconst hm = t => new Date(t).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});\nconst todayStr = () => new Date().toLocaleDateString('en-CA');\n// Units: all maths is in metres; the page only converts for display and input\nconst U = () => UNITS[P.unit];\nconst toU = m => m / U().f;\nconst fromU = v => v * U().f;\nconst fmt = (m, d) => toU(m).toFixed(d === undefined ? U().dec : d) + ' ' + U().sym;\nconst num = el => { const v = parseFloat(el.value); return Number.isFinite(v) ? v : NaN; };\nconst sl = (minM, maxM) => `min=\"${toU(minM).toFixed(2)}\" max=\"${toU(maxM).toFixed(2)}\" step=\"${U().step}\"`;\nconst SV = $('pSvg');\nconst P = {nw: 0, nh: 0, loc: null, pts: [], ri: -1, si: -1, i: null, north: 0, unit: 'ft',\n  stage: 'corners', cal: [], W: 0, D: 0, Hf: null, Hi: null,\n  objs: [], trees: [], zones: [], sel: -1, poly: [], mode: 'panel',\n  pLong: 2.28, pShort: 1.13, orient: 'L', rowsDef: 2, colsDef: 3, fd: 180, tilt: 10, wp: 550, defH: 1,\n  year: 2026, doy: 1, ds: '', timer: null};\nlet PL = [], drag = null, raf = 0, EDIT = false;\n\n// ---------- sun ----------\n// Solar position (NOAA-style approximation): elevation and azimuth from North, clockwise\nfunction sunPos(ms, lat, lon) {\n  const d = ms / 86400000 - 10957.5;\n  const L = 280.460 + 0.9856474 * d;\n  const g = (357.528 + 0.9856003 * d) * R;\n  const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * R;\n  const eps = (23.439 - 0.0000004 * d) * R;\n  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));\n  const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));\n  const H = (280.46061837 + 360.98564736629 * d) * R + lon * R - ra;\n  const phi = lat * R;\n  const el = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));\n  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)) / R + 180;\n  return {t: ms, el: el / R, az: deg(az)};\n}\nfunction dayPts(lat, lon, ds) {\n  const [y, m, dd] = ds.split('-').map(Number);\n  const s0 = new Date(y, m - 1, dd).getTime();\n  const pts = [];\n  for (let i = 0; i <= 288; i++) pts.push(sunPos(s0 + i * 300000, lat, lon));\n  return pts;\n}\n// Vector towards the sun in the plan frame (horizontal unit vector), cot of elevation\nfunction sunFrom(q) {\n  if (!q || !(q.el > 0.5)) return null;\n  const b = (q.az - P.north) * R, el = q.el * R;\n  return {ux: Math.sin(b), uy: Math.cos(b), ct: 1 / Math.tan(el), cosEl: Math.cos(el), sinEl: Math.sin(el)};\n}\n\n// ---------- geometry ----------\nfunction solve(A, b) {\n  const n = b.length, m = A.map((r, i) => [...r, b[i]]);\n  for (let c = 0; c < n; c++) {\n    let p = c;\n    for (let r = c + 1; r < n; r++) if (Math.abs(m[r][c]) > Math.abs(m[p][c])) p = r;\n    [m[c], m[p]] = [m[p], m[c]];\n    for (let r = 0; r < n; r++) if (r !== c) {\n      const f = m[r][c] / m[c][c];\n      for (let k = c; k <= n; k++) m[r][k] -= f * m[c][k];\n    }\n  }\n  return m.map((r, i) => r[n] / r[i]);\n}\nfunction homog(src, dst) {\n  const A = [], b = [];\n  src.forEach(([u, v], i) => {\n    const [x, y] = dst[i];\n    A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); b.push(x);\n    A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); b.push(y);\n  });\n  return [...solve(A, b), 1];\n}\nfunction ap(M9, x, y) {\n  const w = M9[6] * x + M9[7] * y + M9[8];\n  return [(M9[0] * x + M9[1] * y + M9[2]) / w, (M9[3] * x + M9[4] * y + M9[5]) / w];\n}\n// Screen rotation that points the compass North to true North on the photo\nfunction northRot() {\n  const B = P.north * R;\n  let dx = Math.sin(-B), dy = -Math.cos(-B);\n  if (P.Hf) {\n    const e = 0.25 * Math.max(P.W, P.D);\n    const c = ap(P.Hi, P.W / 2, P.D / 2), n = ap(P.Hi, P.W / 2 + e * Math.sin(-B), P.D / 2 + e * Math.cos(-B));\n    dx = n[0] - c[0]; dy = n[1] - c[1];\n  }\n  return Math.atan2(dy, dx) / R + 90;\n}\nfunction inPoly(F, x, y) {\n  let c = false;\n  for (let i = 0, j = F.length - 1; i < F.length; j = i++) {\n    const [xi, yi] = F[i], [xj, yj] = F[j];\n    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;\n  }\n  return c;\n}\nconst cross3 = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);\nconst segCross = (a, b, c, d) => cross3(c, d, a) * cross3(c, d, b) < 0 && cross3(a, b, c) * cross3(a, b, d) < 0;\nfunction toImg(pts) { return pts.map(([x, y]) => ap(P.Hi, x, y).join(',')).join(' '); }\nfunction circ(x, y, r) { const out = []; for (let k = 0; k < 16; k++) out.push([x + r * Math.cos(k * Math.PI / 8), y + r * Math.sin(k * Math.PI / 8)]); return out; }\nfunction unitPx() { const w = SV.getBoundingClientRect().width; return w > 20 ? P.nw / w : P.nw / 360; }\nfunction ptr(e) {\n  const b = SV.getBoundingClientRect(), u = (e.clientX - b.left) / b.width * P.nw, v = (e.clientY - b.top) / b.height * P.nh;\n  return {u, v, p: P.Hf ? ap(P.Hf, u, v) : null};\n}\n// Puts the four tapped corners in the order bottom-left, bottom-right, top-right, top-left, whatever their tap order\nfunction orderCorners(pts) {\n  let s = 0;\n  for (let i = 0; i < 4; i++) s += pts[i][0] * pts[(i + 1) % 4][1] - pts[(i + 1) % 4][0] * pts[i][1];\n  const q = s > 0 ? pts.slice().reverse() : pts.slice();\n  let k = 0;\n  for (let i = 1; i < 4; i++) if (q[i][0] - q[i][1] < q[k][0] - q[k][1]) k = i;\n  return [0, 1, 2, 3].map(i => q[(k + i) % 4]);\n}\n\n// ---------- shadows ----------\n// An object spans heights h0..h1 above the roof. A point at height z is shaded if the segment from the point\n// towards the sun, between heights h0 and h1, touches the object's footprint F.\nfunction shadowedBy(o, x, y, z, sun) {\n  if (z >= o.h1) return false;\n  const s0 = Math.max(0, o.h0 - z) * sun.ct, s1 = (o.h1 - z) * sun.ct;\n  const ax = x + s0 * sun.ux, ay = y + s0 * sun.uy, bx = x + s1 * sun.ux, by = y + s1 * sun.uy;\n  if (inPoly(o.F, ax, ay) || inPoly(o.F, bx, by)) return true;\n  const n = o.F.length;\n  for (let i = 0, j = n - 1; i < n; j = i++) if (segCross([ax, ay], [bx, by], o.F[j], o.F[i])) return true;\n  return false;\n}\nfunction shadowedAt(x, y, z, sun) {\n  for (const o of PL) if (shadowedBy(o, x, y, z, sun)) return true;\n  return false;\n}\n// Share of one panel in shadow (3x3 sample points on its tilted surface). only = test one object only.\nfunction cellShade(c, sun, only) {\n  if (!sun || !PL.length) return 0;\n  let hit = 0;\n  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {\n    const x = c.x0 + (c.x1 - c.x0) * (i + 0.5) / 3, y = c.y0 + (c.y1 - c.y0) * (j + 0.5) / 3;\n    const zz = (x * c.gx + y * c.gy - c.qmin) * c.tb;\n    if (only ? shadowedBy(only, x, y, zz, sun) : shadowedAt(x, y, zz, sun)) hit++;\n  }\n  return hit / 9;\n}\n// Direct-sun factor of a tilted panel\nfunction incidence(z, sun) {\n  if (!sun) return 0;\n  const fr = (z.fd - P.north) * R, tl = z.tilt * R;\n  return Math.max(0, Math.sin(tl) * sun.cosEl * (Math.sin(fr) * sun.ux + Math.cos(fr) * sun.uy) + Math.cos(tl) * sun.sinEl);\n}\n// Panels of one zone at their real size; each panel rises towards the back (opposite its facing direction)\nfunction cellsOf(z) {\n  const out = [], fr = (z.fd - P.north) * R, fx = Math.sin(fr), fy = Math.cos(fr), gx = -fx, gy = -fy, tb = Math.tan(z.tilt * R);\n  for (let i = 0; i < z.rows; i++) for (let j = 0; j < z.cols; j++) {\n    const x0 = z.x0 + j * (z.pw + G), y0 = z.y0 + i * (z.ph + G), x1 = x0 + z.pw, y1 = y0 + z.ph;\n    const qmin = Math.min(x0 * gx + y0 * gy, x1 * gx + y0 * gy, x1 * gx + y1 * gy, x0 * gx + y1 * gy);\n    out.push({x0, x1, y0, y1, w: z.w, z, gx, gy, qmin, tb});\n  }\n  return out;\n}\nfunction zb(z) { return {X0: z.x0, Y0: z.y0, X1: z.x0 + z.cols * z.pw + (z.cols - 1) * G, Y1: z.y0 + z.rows * z.ph + (z.rows - 1) * G}; }\nfunction inZone(z, x, y) { const b = zb(z); return x >= b.X0 && x <= b.X1 && y >= b.Y0 && y <= b.Y1; }\nfunction cornersOf(z) { const b = zb(z); return [[b.X0, b.Y0], [b.X1, b.Y0], [b.X1, b.Y1], [b.X0, b.Y1]]; }\n// Shadow drawn on the photo: the object's base and its top are swept between the two heights\nfunction shadowGroup(o, sun) {\n  const off = t => [-t * sun.ct * sun.ux, -t * sun.ct * sun.uy];\n  const a = off(o.h0), b = off(o.h1), n = o.F.length;\n  const A = o.F.map(([x, y]) => [x + a[0], y + a[1]]), B = o.F.map(([x, y]) => [x + b[0], y + b[1]]);\n  let s = `<polygon points=\"${toImg(A)}\"/><polygon points=\"${toImg(B)}\"/>`;\n  for (let i = 0, j = n - 1; i < n; j = i++) s += `<polygon points=\"${toImg([A[j], A[i], B[i], B[j]])}\"/>`;\n  return `<g class=\"shdG\">${s}<\/g>`;\n}\n// Average loss over the day (every 15 minutes), weighted by watts times the direct-sun factor\nfunction dayLoss(cs) {\n  let sum = 0, n = 0;\n  for (let i = P.ri; i <= P.si; i += 3) {\n    const sun = sunFrom(P.pts[i]);\n    if (!sun) continue;\n    let lost = 0, avail = 0;\n    cs.forEach(c => { const pw = c.w * incidence(c.z, sun); avail += pw; lost += pw * cellShade(c, sun); });\n    if (avail > 0) { sum += lost / avail; n++; }\n  }\n  return n ? sum / n : 0;\n}\n\n// ---------- zones ----------\nfunction zoneDims() { return {pw: P.orient === 'L' ? P.pLong : P.pShort, ph: P.orient === 'L' ? P.pShort : P.pLong}; }\nfunction makeZone(x0, y0, rows, cols) { const d = zoneDims(); return {name: '', x0, y0, rows, cols, pw: d.pw, ph: d.ph, or: P.orient, w: P.wp, fd: P.fd, tilt: P.tilt}; }\nfunction commitZone(z) { z.name = z.name || 'Zone ' + (P.zones.length + 1); P.zones.push(z); P.sel = P.zones.length - 1; loadPanelInputs(); renderZList(); }\n// Tap: a block of the default rows x columns, centred on the tap\nfunction placeDefault(x, y) {\n  const rows = P.rowsDef, cols = P.colsDef, d = zoneDims();\n  const W = cols * d.pw + (cols - 1) * G, H = rows * d.ph + (rows - 1) * G;\n  commitZone(makeZone(x - W / 2, y - H / 2, rows, cols));\n}\n// Drag: the block fills the dragged rectangle, rounded to whole panels\nfunction rectZone(a, b) {\n  const d = zoneDims(), x0 = Math.min(a[0], b[0]), y0 = Math.min(a[1], b[1]), w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);\n  const cols = Math.max(1, Math.round((w + G) / (d.pw + G))), rows = Math.max(1, Math.round((h + G) / (d.ph + G)));\n  return makeZone(x0, y0, rows, cols);\n}\nfunction selZone() { return P.zones[P.sel] || null; }\nfunction selectZone(i) { P.sel = i; loadPanelInputs(); renderZList(); redraw(); }\nfunction renderZList() {\n  $('zList').innerHTML = P.zones.map((z, i) => `<button class=\"zbtn${P.sel === i ? ' on' : ''}\" data-i=\"${i}\">${z.name} · ${z.rows}×${z.cols} · ${fmt(z.or === 'L' ? z.pw : z.ph)} × ${fmt(z.or === 'L' ? z.ph : z.pw)} · ${dirName(z.fd)}<\/button>`).join('');\n}\n// Shows the selected panel's options; with nothing selected, shows the defaults for new panels\nfunction loadPanelInputs() {\n  const z = selZone();\n  const L = z ? (z.or === 'L' ? z.pw : z.ph) : P.pLong, Wd = z ? (z.or === 'L' ? z.ph : z.pw) : P.pShort;\n  $('panelInfo').textContent = z ? `தேர்ந்த பேனல்: ${z.name}` : 'புதிய பேனல்களுக்கான அளவுகள் (எதுவும் தேர்வு இல்லை)';\n  $('zL').value = toU(L).toFixed(2); $('zWd').value = toU(Wd).toFixed(2);\n  $('zR').value = z ? z.rows : P.rowsDef; $('zC').value = z ? z.cols : P.colsDef;\n  $('zFd').value = z ? z.fd : P.fd; $('zTilt').value = z ? z.tilt : P.tilt; $('zW').value = z ? z.w : P.wp;\n  $('zN').value = z ? (z.name || '') : '';\n  $('zRot').textContent = (z ? z.or : P.orient) === 'L' ? '↔ படுக்கை' : '↕ நிமிர்ந்து';\n  $('zSel').textContent = z ? `தேர்ந்தது: ${z.name} · ${z.rows}×${z.cols} · ${dirName(z.fd)} · சாய்வு ${z.tilt}°` : 'தேர்வு இல்லை';\n  $('zDel').disabled = !z;\n}\n// Typed values go to the selected panel, or to the defaults when nothing is selected\nfunction applyPanelInputs() {\n  const z = selZone();\n  const L = fromU(num($('zL'))), Wd = fromU(num($('zWd')));\n  const rows = Math.max(1, Math.round(num($('zR'))) || 1), cols = Math.max(1, Math.round(num($('zC'))) || 1);\n  const fd = +$('zFd').value, tilt = Math.min(45, Math.max(0, parseFloat($('zTilt').value) || 0)), w = +$('zW').value || 550;\n  if (z) {\n    if (L > 0 && Wd > 0) { if (z.or === 'L') { z.pw = L; z.ph = Wd; } else { z.pw = Wd; z.ph = L; } }\n    z.rows = rows; z.cols = cols; z.fd = fd; z.tilt = tilt; z.w = w; z.name = $('zN').value;\n    $('zSel').textContent = `தேர்ந்தது: ${z.name} · ${z.rows}×${z.cols} · ${dirName(z.fd)} · சாய்வு ${z.tilt}°`;\n    renderZList();\n  } else {\n    if (L > 0 && Wd > 0) { P.pLong = L; P.pShort = Wd; }\n    P.rowsDef = rows; P.colsDef = cols; P.fd = fd; P.tilt = tilt; P.wp = w;\n  }\n  redraw();\n}\n\n// ---------- objects and trees ----------\nfunction addObject(pts) {\n  const step = Math.max(1, Math.ceil(pts.length / 60));\n  const s = pts.filter((_, i) => i % step === 0);\n  P.objs.push({name: $('mkN').value.trim() || 'பொருள் ' + (P.objs.length + 1), h: P.defH, pts: s});\n  $('mkN').value = ''; renderObjList();\n}\nfunction addTree(x, y) { P.trees.push({name: 'மரம் ' + (P.trees.length + 1), x, y, h: 6, r: 2}); renderTreeList(); }\nfunction renderObjList() {\n  $('objList').innerHTML = P.objs.map((o, i) => `<div class=\"row\"><span style=\"flex:0 0 28%\">${o.name}<\/span><input type=\"range\" ${sl(0, 50)} value=\"${toU(o.h).toFixed(2)}\" data-o=\"${i}\"><input type=\"number\" ${sl(0, 50)} value=\"${toU(o.h).toFixed(2)}\" data-n=\"${i}\" style=\"flex:0 0 74px\"><button data-d=\"${i}\">✕<\/button><\/div>`).join('');\n}\nfunction renderTreeList() {\n  $('treeList').innerHTML = P.trees.map((t, i) => `<div class=\"card\" style=\"margin:6px 0;padding:8px\"><div class=\"row\"><b>${t.name}<\/b><button data-td=\"${i}\">✕<\/button><\/div>\n    <label>உயரம்: <span data-th-txt=\"${i}\">${fmt(t.h)}<\/span><input type=\"range\" ${sl(1, 50)} value=\"${toU(t.h).toFixed(2)}\" data-th=\"${i}\"><\/label>\n    <label>அகலம்: <span data-tr-txt=\"${i}\">${fmt(2 * t.r)}<\/span><input type=\"range\" ${sl(1, 20)} value=\"${toU(2 * t.r).toFixed(2)}\" data-tr=\"${i}\"><\/label><\/div>`).join('');\n}\n\n// ---------- roof ----------\nfunction refreshRoofInputs() {\n  $('rl').value = P.W > 0 ? toU(P.W).toFixed(2) : '';\n  $('rw').value = P.D > 0 ? toU(P.D).toFixed(2) : '';\n}\n// Sets the roof size. When the roof is measured again, zones and trees keep their place on the photo.\nfunction setRoof(W, D) {\n  if (P.W > 0 && P.D > 0) {\n    const fx = W / P.W, fy = D / P.D;\n    P.zones.forEach(z => { z.x0 *= fx; z.y0 *= fy; });\n    P.trees.forEach(t => { t.x *= fx; t.y *= fy; });\n  }\n  P.W = W; P.D = D;\n  const dst = [[0, 0], [W, 0], [W, D], [0, D]];\n  P.Hf = homog(P.cal, dst); P.Hi = homog(dst, P.cal);\n  if (P.stage !== 'ready') { P.stage = 'ready'; setMode('panel'); }\n  $('pErr').textContent = '';\n  refreshAll();\n}\nfunction resetCal() {\n  P.stage = 'corners'; P.cal = []; P.Hf = null; P.Hi = null; P.W = 0; P.D = 0;\n  P.zones = []; P.trees = []; P.sel = -1; P.poly = [];\n  refreshRoofInputs(); renderZList(); renderTreeList();\n}\n\n// ---------- modes and screens ----------\nfunction stepText() {\n  if (P.stage === 'corners') return `1) போட்டோவில் கூரையின் 4 மூலைகளை tap பண்ணுங்கள் (${P.cal.length}/4). எந்த வரிசையிலும் பரவாயில்லை.`;\n  if (P.stage === 'size') return '2) கூரையின் நீளம், அகலம் கொடுத்து \"அளவு அமை\" அழுத்துங்கள்.';\n  const m = {panel: 'பேனல்: காலி இடத்தில் tap பண்ணுங்கள், அல்லது இழுத்து வரையுங்கள். பேனலைத் தேர்ந்தெடுத்தால் அதன் அளவு, திசை கீழே வரும்.', obj: 'பொருள்: பேனாவால் வெளி எல்லையை இழுத்து வரையுங்கள்.', tree: 'மரம்: வைக்க வேண்டிய இடத்தில் tap பண்ணுங்கள்.', roof: 'கூரை: நீளம், அகலம் மாற்றி \"அளவு அமை\" அழுத்துங்கள்.'};\n  return m[P.mode] || '';\n}\nfunction refreshUI() {\n  const ready = P.stage === 'ready';\n  $('toolCard').hidden = !ready;\n  $('roofBox').hidden = !(P.stage === 'size' || (ready && P.mode === 'roof'));\n  $('panelBox').hidden = !(ready && P.mode === 'panel');\n  $('objBox').hidden = !(ready && P.mode === 'obj');\n  $('treeBox').hidden = !(ready && P.mode === 'tree');\n  $('timeBox').hidden = !(P.loc && P.ri >= 0);\n  $('mPanel').classList.toggle('on', P.mode === 'panel');\n  $('mObj').classList.toggle('on', P.mode === 'obj');\n  $('mTree').classList.toggle('on', P.mode === 'tree');\n  $('mRoof').classList.toggle('on', P.mode === 'roof');\n  $('pStep').textContent = stepText();\n}\nfunction setMode(m) { P.mode = m; P.poly = []; refreshUI(); redraw(); }\n// Re-applies the unit everywhere\nfunction refreshAll() {\n  document.querySelectorAll('.uName').forEach(el => { el.textContent = U().name; });\n  $('mkH').value = toU(P.defH).toFixed(2);\n  loadPanelInputs(); refreshRoofInputs(); renderObjList(); renderTreeList(); refreshUI(); redraw();\n}\n\n// ---------- drawing ----------\nfunction draw() {\n  PL = [];\n  if (P.Hf) {\n    P.objs.forEach(o => PL.push({owner: o, h0: 0, h1: o.h, F: o.pts.map(([x, y]) => ap(P.Hf, x, y))}));\n    P.trees.forEach(t => {\n      PL.push({owner: t, part: 'c', h0: 0.4 * t.h, h1: t.h, F: circ(t.x, t.y, t.r)});\n      PL.push({owner: t, part: 't', h0: 0, h1: 0.4 * t.h, F: circ(t.x, t.y, 0.15)});\n    });\n  }\n  const q = P.pts[P.i], sun = sunFrom(q), u = unitPx(), rot = northRot(), th = rot * R, rc = u * 26, DA = `${u * 4} ${u * 3}`;\n  const label = (x, y, s, fs) => `<text class=\"lb\" x=\"${x}\" y=\"${y}\" font-size=\"${fs}\" stroke-width=\"${u * 2.5}\">${s}<\/text>`;\n  const cs = P.zones.flatMap(z => cellsOf(z));\n  let kwNow = 0, kwTot = 0, nShade = 0;\n  cs.forEach(c => { c.inc = incidence(c.z, sun); c.f = cellShade(c, sun); kwTot += c.w / 1000; kwNow += (1 - c.f) * c.w * c.inc / 1000; if (c.f > 0.5) nShade++; });\n  let g = '';\n\n  // Panels: blue when lit, dark where shaded; no size text on the panels\n  cs.forEach(c => {\n    const pts = toImg([[c.x0, c.y0], [c.x1, c.y0], [c.x1, c.y1], [c.x0, c.y1]]);\n    g += `<polygon points=\"${pts}\" fill=\"#3d6bff\" fill-opacity=\"${(0.12 + 0.55 * c.inc * (1 - c.f)).toFixed(2)}\" stroke=\"#fff\" stroke-opacity=\".85\" stroke-width=\"${u * 1.2}\"/>`;\n    if (c.f > 0) g += `<polygon points=\"${pts}\" fill=\"#070b16\" fill-opacity=\"${(0.85 * c.f).toFixed(2)}\"/>`;\n    if (c.tb > 0.001) {\n      const E = [[[c.x0, c.y0], [c.x1, c.y0]], [[c.x1, c.y0], [c.x1, c.y1]], [[c.x1, c.y1], [c.x0, c.y1]], [[c.x0, c.y1], [c.x0, c.y0]]];\n      let best = 0, bv = -1e9;\n      E.forEach((e, k) => { const d = ((e[0][0] + e[1][0]) / 2) * c.gx + ((e[0][1] + e[1][1]) / 2) * c.gy; if (d > bv) { bv = d; best = k; } });\n      const a = ap(P.Hi, E[best][0][0], E[best][0][1]), b = ap(P.Hi, E[best][1][0], E[best][1][1]);\n      g += `<line class=\"back\" x1=\"${a[0]}\" y1=\"${a[1]}\" x2=\"${b[0]}\" y2=\"${b[1]}\" stroke-width=\"${u * 2.5}\"/>`;\n    }\n  });\n  P.zones.forEach((z, zi) => {\n    const b = zb(z), fr = (z.fd - P.north) * R, cx = (b.X0 + b.X1) / 2, cy = (b.Y0 + b.Y1) / 2;\n    const A = ap(P.Hi, cx, cy), T = ap(P.Hi, cx + Math.sin(fr) * Math.min(z.pw, z.ph) * 0.8, cy + Math.cos(fr) * Math.min(z.pw, z.ph) * 0.8);\n    g += `<line x1=\"${A[0]}\" y1=\"${A[1]}\" x2=\"${T[0]}\" y2=\"${T[1]}\" stroke=\"#fff\" stroke-opacity=\".9\" stroke-width=\"${u * 2}\"/>`;\n    if (P.sel === zi) {\n      const cor = cornersOf(z);\n      g += `<polygon class=\"sel\" points=\"${toImg(cor)}\" stroke-width=\"${u * 2}\" stroke-dasharray=\"${DA}\"/>`;\n      cor.forEach(([x, y]) => { const [hx, hy] = ap(P.Hi, x, y); g += `<circle class=\"hd\" cx=\"${hx}\" cy=\"${hy}\" r=\"${u * 9}\" stroke-width=\"${u * 2}\"/>`; });\n    }\n  });\n  // Block being drawn by dragging\n  if (drag && drag.mode === 'draw' && drag.prev) {\n    cellsOf(drag.prev).forEach(c => { g += `<polygon class=\"pend\" points=\"${toImg([[c.x0, c.y0], [c.x1, c.y0], [c.x1, c.y1], [c.x0, c.y1]])}\" stroke-width=\"${u * 2}\" stroke-dasharray=\"${DA}\"/>`; });\n  }\n\n  // Trees: trunk and canopy with a shaded green sphere look\n  P.trees.forEach(t => {\n    if (!P.Hi) return;\n    const b = ap(P.Hi, t.x, t.y), e = ap(P.Hi, t.x + t.r, t.y), rp = Math.hypot(e[0] - b[0], e[1] - b[1]) || u * 4, cy = b[1] - rp * 0.9;\n    g += `<line class=\"trunk\" x1=\"${b[0]}\" y1=\"${b[1]}\" x2=\"${b[0]}\" y2=\"${cy}\" stroke-width=\"${Math.max(u * 2, rp * 0.18)}\"/>`;\n    g += `<circle class=\"tree\" cx=\"${b[0]}\" cy=\"${cy}\" r=\"${rp}\"/>`;\n  });\n\n  // Objects: outline and name\n  P.objs.forEach(o => { g += `<polygon class=\"ob\" points=\"${o.pts.map(p => p.join(',')).join(' ')}\" stroke-width=\"${u * 2}\"/>` + label(o.pts[0][0], o.pts[0][1] - u * 6, o.name, u * 12); });\n\n  // Pen stroke and tap outline in progress\n  if (drag && drag.mode === 'stroke' && drag.pts.length > 1) g += `<polyline class=\"pend\" points=\"${drag.pts.map(p => p.join(',')).join(' ')}\" fill=\"none\" stroke-width=\"${u * 2}\"/>`;\n  if (P.poly.length) {\n    const pts = P.poly.map(p => p.join(',')).join(' ');\n    g += P.poly.length >= 3 ? `<polygon class=\"pend\" points=\"${pts}\" stroke-width=\"${u * 2}\" stroke-dasharray=\"${DA}\"/>` : `<polyline class=\"pend\" points=\"${pts}\" fill=\"none\" stroke-width=\"${u * 2}\" stroke-dasharray=\"${DA}\"/>`;\n    P.poly.forEach(([x, y]) => g += `<circle class=\"dot\" cx=\"${x}\" cy=\"${y}\" r=\"${u * 4}\"/>`);\n  }\n  // Roof corners\n  if (P.cal.length) {\n    g += `<polygon class=\"cal\" points=\"${P.cal.map(p => p.join(',')).join(' ')}\" stroke-width=\"${u * 2}\" stroke-dasharray=\"${DA}\"/>`;\n    P.cal.forEach(([x, y], j) => g += `<circle class=\"cdot\" cx=\"${x}\" cy=\"${y}\" r=\"${u * 6}\"/>` + label(x + u * 6, y - u * 6, j + 1, u * 13));\n  }\n\n  // Shadows of objects and trees on the roof\n  if (sun) PL.forEach(e => g += shadowGroup(e, sun));\n\n  // Sun glow, compass with sun direction\n  if (sun) {\n    const lx = Math.sin(q.az * R), ly = -Math.cos(q.az * R);\n    const sx = lx * Math.cos(th) - ly * Math.sin(th), sy = lx * Math.sin(th) + ly * Math.cos(th);\n    const gx = Math.min(P.nw * 0.95, Math.max(P.nw * 0.05, P.nw / 2 + sx * P.nw * 0.45));\n    const gy = Math.min(P.nh * 0.95, Math.max(P.nh * 0.05, P.nh / 2 + sy * P.nh * 0.45));\n    g += `<circle cx=\"${gx}\" cy=\"${gy}\" r=\"${u * 14}\" fill=\"#ffd54f\" opacity=\".35\"/><circle cx=\"${gx}\" cy=\"${gy}\" r=\"${u * 5}\" fill=\"#fff59d\"/>`;\n  }\n  g += `<g transform=\"translate(${u * 30} ${u * 30}) rotate(${rot})\"><circle class=\"cbg\" r=\"${rc}\" stroke-width=\"${u}\"/><line class=\"nArr\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"${-rc * 0.8}\" stroke-width=\"${u * 2.5}\"/>`;\n  [['N', 0], ['E', 90], ['S', 180], ['W', 270]].forEach(([t, a]) => g += `<text class=\"ctx\" x=\"${Math.sin(a * R) * rc * 0.72}\" y=\"${-Math.cos(a * R) * rc * 0.72}\" font-size=\"${u * 12}\">${t}<\/text>`);\n  for (let i = P.ri; i > 0 && i <= P.si; i += 12) { const s = P.pts[i]; g += `<circle class=\"dot\" cx=\"${Math.sin(s.az * R) * rc * 0.9}\" cy=\"${-Math.cos(s.az * R) * rc * 0.9}\" r=\"${u * 3}\"/>`; }\n  if (sun) g += `<line class=\"sunA\" x1=\"0\" y1=\"0\" x2=\"${Math.sin(q.az * R) * rc * 0.85}\" y2=\"${-Math.cos(q.az * R) * rc * 0.85}\" stroke-width=\"${u * 3}\"/>`;\n  g += '<\/g>';\n  $('layer').innerHTML = g;\n\n  // Readouts\n  $('pTimeTxt').textContent = q ? `${hm(q.t)} · உயரம் ${q.el.toFixed(0)}° · சூரியன் ${dirName(q.az)}` : '';\n  if (P.Hf && P.ri >= 0) {\n    $('pStats').innerHTML = cs.length\n      ? `பேனல்கள்: <b>${cs.length}<\/b> · மொத்தம் <b>${kwTot.toFixed(2)} kW<\/b> · இப்போது <b>${kwNow.toFixed(2)} kW<\/b> · நிழலில் உள்ள பேனல்கள்: <b>${nShade}<\/b> · நாள் சராசரி நிழல் இழப்பு: <b>${(dayLoss(cs) * 100).toFixed(0)}%<\/b>`\n      : 'பேனல்களை சேர்த்தால் கணக்கு இங்கே வரும்';\n  } else {\n    $('pStats').innerHTML = '';\n  }\n  const rd = [];\n  P.objs.forEach(o => {\n    const e = PL.find(p => p.owner === o);\n    if (sun && e) { const hit = cs.filter(c => cellShade(c, sun, e) > 0).length; rd.push(`<div>🔹 <b>${o.name}<\/b>: நிழல் <b>${dirName(q.az + 180)}<\/b> திசையில் · ${hit ? hit + ' பேனலில் நிழல் விழுகிறது' : 'பேனலில் நிழல் இல்லை'}<\/div>`); }\n  });\n  P.trees.forEach(t => {\n    const e = PL.find(p => p.owner === t && p.part === 'c');\n    if (sun && e) { const hit = cs.filter(c => cellShade(c, sun, e) > 0).length; rd.push(`<div>🌳 <b>${t.name}<\/b>: நிழல் <b>${dirName(q.az + 180)}<\/b> திசையில் · ${hit ? hit + ' பேனலில் ந span id=\"st\"><\/span>\n  <\/div>\n <\/div>\n<\/div>\n<\/div>\n\n<div id=\"pv\" hidden><div id=\"pvb\"><\/div><\/div>\n\n<script>\nconst $=id=>document.getElementById(id),K='fe_quote_v2';\nconst DV=[[\"Panel\",\"13842.5\",\"5\",\"6\"],[\"Inverter 3.6 KW\",\"15500\",\"5\",\"1\"],[\"Structure\",\"12000\",\"18\",\"1\"],[\"DC Cable\",\"71\",\"18\",\"60\"],[\"4 qmm Green\",\"70\",\"0\",\"60\"],[\"4 qmm AC Cable\",\"70\",\"0\",\"100\"],[\"6 qmm Cable\",\"110\",\"0\",\"30\"],[\"Lightning Arrestor\",\"600\",\"18\",\"1\"],[\"Earth Rod\",\"350\",\"18\",\"3\"],[\"Compound\",\"200\",\"0\",\"2\"],[\"Chamber Box\",\"325\",\"18\",\"3\"],[\"DCDB\",\"1650\",\"18\",\"1\"],[\"ACDB\",\"1400\",\"18\",\"1\"],[\"3/4 water pipe\",\"70\",\"0\",\"20\"],[\"Bend & Elbow\",\"15\",\"0\",\"30\"],[\"4 M Spring Hose\",\"50\",\"0\",\"2\"],[\"SS Saddles\",\"7\",\"0\",\"50\"],[\"Anchor Bolt\",\"35\",\"0\",\"16\"],[\"Auto Rent\",\"7500\",\"0\",\"1\"],[\"Labour\",\"3500\",\"0\",\"3\"],[\"PVC Channel\",\"250\",\"0\",\"1\"],[\"EB Netmeter\",\"4770\",\"0\",\"0\"],[\"EB AE\",\"2500\",\"0\",\"0\"],[\"Extra\",\"2500\",\"0\",\"0\"]];\nconst DVM=Object.fromEntries(DV.map(x=>[x[0],x.slice(1)]));\nconst PW0='565',PN0='6',KW0='3.3';\nlet D=null,W={},G=0,mode='p';\ntry{D=JSON.parse(localStorage.getItem(K))}catch(e){}\nconst put=()=>{try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){return false}};\nif(!D){let o=null;try{o=JSON.parse(localStorage.getItem('fe_quote_v1'))}catch(e){}D={p:DV.map(x=>x[0]),c:(o&&o.c)||{}};put()}\n$('kw').value=KW0;\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'})[c]);\nconst fmt=x=>Number(x).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst today=()=>new Date().toLocaleDateString('en-IN');\nconst msg=t=>{$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',2500)};\nconst parseP=()=>{D.p=$('plist').value.split('\\n').map(s=>s.trim()).filter(Boolean)};\nfunction saveP(){parseP();msg(put()?'பொருட்கள் சேமிக்கப்பட்டது':'சேமிக்க முடியவில்லை')}\nfunction list(){\n const ks=Object.keys(D.c);\n $('list').innerHTML=ks.length?ks.map(p=>`<div class=\"it\"><span>${esc(D.c[p].n)} · ${esc(p)} · ${esc(D.c[p].k)} KW<\/span><span><button data-p=\"${esc(p)}\" onclick=\"pick(this.dataset.p)\">திற<\/button><button class=\"g\" data-p=\"${esc(p)}\" onclick=\"pick(this.dataset.p,1)\">திருத்து<\/button><\/span><\/div>`).join(''):'<p>சேமித்த பதிவு இல்லை<\/p>';\n}\n$('plist').value=D.p.join('\\n');\n$('plist').oninput=()=>{parseP();put()};\nlist();\n$('ph').oninput=()=>{const r=D.c[$('ph').value.trim()];if(r){$('nm').value=r.n;$('kw').value=r.k}};\n$('ph').onkeydown=e=>{if(e.key==='Enter')ok()};\nfunction itemsOf(r){\n if(r.it)return r.it.map(x=>x.slice());\n if(r.r){\n  const names=[...D.p];\n  for(const k of Object.keys(r.r))if(!names.includes(k))names.push(k);\n  return names.map(n=>{const v=r.r[n]||r.r[n.replace(' water','')]||[];return [n,v[0]||'',v[1]||'',v[2]||''];});\n }\n return D.p.map(n=>{const v=DVM[n]||[];return [n,v[0]||'',v[1]||'',v[2]||''];});\n}\nfunction ok(force){\n const ph=$('ph').value.trim(),n=$('nm').value.trim(),k=$('kw').value;\n if(!ph||!n)return alert('பெயர் & செல் நம்பர் போடுங்க');\n parseP();put();\n const r=D.c[ph]||{};\n const same=!!r.ph&&r.n===n&&r.k===k;\n W={ph,n,k,pw:!r.ph?PW0:(r.pw||''),pn:!r.ph?PN0:(r.pn||''),pp:r.pp||'',pa:r.pa||'',sb:r.sb||'',dt:r.dt||'',it:itemsOf(r)};\n showQ(same&&!force);\n}\nfunction pick(p,force){const r=D.c[p];$('ph').value=p;$('nm').value=r.n;$('kw').value=r.k;ok(force)}\nfunction setMode(on){\n $('s2').classList.toggle('view',!on);\n $('fs').disabled=!on;\n $('bSave').hidden=!on;\n $('bEdit').hidden=on||!D.c[W.ph];\n}\nfunction showQ(view){\n $('s1').hidden=true;$('s2').hidden=false;\n $('hd').textContent=(W.k||'')+' - KW';\n $('info').textContent='பெயர்: '+W.n+'     செல்: '+W.ph;\n $('pw').value=W.pw;$('pn').value=W.pn;$('pp').value=W.pp;$('pa').value=W.pa;$('sb').value=W.sb;\n mode=(!W.pp&&W.pa)?'a':'p =$('sb').value;\n W.dt=today();\n D.c[W.ph]=JSON.parse(JSON.stringify(W));\n $('st').textContent=put()?'✔ தானாக சேவ் ஆனது '+new Date().toLocaleTimeString('en-IN'):'⚠ சேவ் ஆகல';\n}\nfunction saveQ(){\n readRows();\n W.pw=$('pw').value;W.pn=$('pn').value;W.pp=$('pp').value;W.pa=$('pa').value;W.sb=$('sb').value;\n W.dt=today();\n D.c[W.ph]=JSON.parse(JSON.stringify(W));\n list();\n setMode(false);\n msg(put()?'சேமிக்கப்பட்டது ✔':'சேமிக்க முடியவில்லை');\n}\nfunction preview(){\n const rows=[...$('rows').children].filter(tr=>+tr.querySelectorAll('input')[2].value>0);\n const body=rows.map(tr=>{const [p,g,q]=tr.querySelectorAll('input');return `<tr><td>${esc(tr.dataset.n)}<\/td><td class=\"c\">${fmt(p.value||0)}<\/td><td class=\"c\">${esc(g.value||0)}%<\/td><td class=\"c\">${tr.cells[3].textContent}<\/td><td class=\"c\">${esc(q.value)}<\/td><td class=\"c\">${tr.cells[5].textContent}<\/td><\/tr>`}).join('');\n const pp=$('pp').value,pa=+$('pa').value||0;\n const pl=$('pw').value&&$('pn').value?`பேனல்: ${esc($('pw').value)} W × ${esc($('pn').value)} = ${$('tw').textContent} W`:'';\n $('pvb').innerHTML=`<div class=\"paper\">\n<div class=\"ph\"><div><div class=\"co\">Future Energies<\/div>12/31 Anna Nagar 1 Cross, Karur - 639002<br>செல்: 8870884466<\/div><div class=\"ql\">QUOTATION<br><small>தேதி: ${W.dt||today()}<\/small><\/div><\/div>\n<div class=\"cu\">பெயர்: <b>${esc(W.n)}<\/b> &nbsp; செல்: <b>${esc(W.ph)}<\/b><\/div>\n<div class=\"pk\">${esc(W.k||'')} - KW<\/div>\n<div class=\"pl\">${pl}<\/div>\n<table class=\"pt\"><thead><tr><th>Product<\/th><th>1 No Price<\/th><th>GST %<\/th><th>Rs + GST<\/th><th>Qty<\/th><th>Total<\/th><\/tr><\/thead><tbody>${body}<\/tbody><\/table>\n<table class=\"tt\">\n<tr><td>Grand Total<\/td><td>${$('gt').textContent}<\/td><\/tr>\n<tr><td>Profit${pp?' ('+esc(pp)+'%)':''}<\/td><td>${fmt(pa)}<\/td><\/tr>\n<tr><td>Total<\/td><td>${$('tp').textContent}<\/td><\/tr>\n<tr><td>Subsidy<\/td><td>${fmt(+$('sb').value||0)}<\/td><\/tr>\n<tr><td><b>Total after       <div class="en">${m.en}</div>
      <p>${m.desc}</p>
      <div class="go">திற</div>
    </button>`;
  }).join('');
}
function openSec(f){
  const s=SECTIONS.find(x=>x.file===f);
  $('frame').srcdoc=s.html;
  $('view').style.display='block';
  $('home').style.display='none';
  $('back').classList.add('show');
  window.scrollTo(0,0);
}
function goHome(){
  $('frame').srcdoc='';
  $('view').style.display='none';
  $('home').style.display='block';
  $('back').classList.remove('show');
  window.scrollTo(0,0);
}
renderHome();
</script>
